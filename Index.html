<div class="shell">
<header class="top"><div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="5" y="4" width="22" height="25" rx="5" stroke="currentColor" stroke-width="2"/><path d="M11 4V1M21 4V1M11 13h10M11 19h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Мой день</div><div class="date"><span id="date"></span><span class="header-zone"> · Омск</span></div></header>
<div id="demo" class="demo" hidden>Тестовый режим · ответы сохраняются только в этом браузере</div>
<nav id="tabs" class="tabs" role="tablist" aria-label="Разделы формы"></nav>
<div class="layout"><aside class="rail" aria-label="Этапы заполнения"><p>Ежедневный отчёт</p><ol class="steps" id="steps"></ol></aside><main id="main" class="card" role="tabpanel" aria-busy="true"><p class="loading" role="status">Загружаем форму…</p></main></div>
<footer class="footer" id="footer">Один день. Несколько слов о главном.</footer>

<script>
'use strict';
const PARTICIPANTS = [
  { id: 'u1', name: 'Димурина Анжелика' },
  { id: 'u2', name: 'Криворучко Елена' },
  { id: 'u8', name: 'Лебедев Евгений' },
  { id: 'u3', name: 'Лукьянцева Ольга' },
  { id: 'u4', name: 'Росоловская Любовь' },
  { id: 'u5', name: 'Самойлов Виталий' },
  { id: 'u6', name: 'Сумарокова Юлия' },
  { id: 'u7', name: 'Усов Денис' }
];
const LIVE = typeof google !== 'undefined' && !!google.script?.run;
const PREFIX = LIVE ? 'daily-project-live-v2:' : 'daily-project-demo-v2:';
// Discard drafts from the trial run after the owner's data reset.
try{for(const key of Object.keys(localStorage)){if(key.startsWith('daily-project-live-v1:')||key.startsWith('daily-project-demo-v1:'))localStorage.removeItem(key)}}catch{}
const names=['Участник','Цель на проект','Сегодня','Завтра','Инсайт'];
const questions=[null,{key:'goal',title:'Какая у вас цель на проект?',description:'К чему хотите прийти? Цель сохранится — завтра её не придётся писать заново.',label:'Моя цель',placeholder:'Опишите результат, к которому стремитесь…'},{key:'today',title:'Что сделали сегодня?',description:'Запишите выполненные задачи. Достаточно 1–2 предложений — небольшой шаг тоже считается.',label:'Сегодня я…',placeholder:'Что удалось сделать за сегодняшний день?'},{key:'tomorrow',title:'Что планируете на завтра?',description:'Что поможет продвинуться к цели? Можно коротко: 1–2 предложения или небольшой список.',label:'Завтра я планирую…',placeholder:'С чего начнёте и что хотите успеть?'},{key:'insight',title:'Какой у вас инсайт дня?',description:'Что сегодня впечатлило или порадовало? Подойдёт и просто хороший момент дня.',label:'Мой инсайт',placeholder:'Мысль, хороший момент или маленькое открытие…'}];
let storageOK=true;
const read=(key,fallback=null)=>{try{const v=localStorage.getItem(PREFIX+key);return v===null?fallback:JSON.parse(v)}catch{return fallback}};
const write=(key,value)=>{try{localStorage.setItem(PREFIX+key,JSON.stringify(value));storageOK=true;return true}catch{storageOK=false;return false}};
const remove=key=>{try{localStorage.removeItem(PREFIX+key)}catch{}};
const day=(date=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Omsk',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
const pretty=d=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Omsk'}).format(new Date(d+'T12:00:00+06:00'));
const clockTime=d=>new Intl.DateTimeFormat('ru-RU',{timeZone:'Asia/Omsk',hour:'2-digit',minute:'2-digit'}).format(new Date(d));
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={step:0,id:read('selected',''),date:day(),participants:PARTICIPANTS,goal:'',today:'',tomorrow:'',insight:'',goalSaved:'',goalEditing:false,yesterdayPlan:'',returnToDaily:false,revisited:false,report:null,revision:null,busy:false,success:false,view:'form',draftSaved:false,resumeStep:2,hasDraft:false,error:'',retrySend:false,reviewOpen:false,returnReview:false,history:[],historyCursor:null,historyError:'',historyReturn:'form',historyId:'',historyTeam:false,historyQuery:'',historyDate:'',dashboard:null,dashboardMonth:'',dashboardError:''};
let serverOffset=0,pending=null;
const today=()=>day(new Date(Date.now()+serverOffset));
const draftKey=()=>`draft:${state.id}:${state.date}`;
function saveDraft(){
 if(!state.id||state.success||state.step===0)return false;
 const meaningful=['today','tomorrow','insight'].some(k=>state[k].trim())||state.goal.trim()!==state.goalSaved;
 if(!meaningful&&!pending)return false;
 state.draftSaved=write(draftKey(),{goal:state.goal,today:state.today,tomorrow:state.tomorrow,insight:state.insight,goalBase:state.goalSaved,baseRevision:state.revision,step:state.step,returnReview:state.returnReview,returnToDaily:state.returnToDaily,updatedAt:new Date().toISOString(),pending});
 return state.draftSaved;
}
function rpc(method,payload){return new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{done=true;reject(new Error('Не получили подтверждение от сервера.'))},30000);google.script.run.withSuccessHandler(r=>{if(!done){done=true;clearTimeout(timer);resolve(r)}}).withFailureHandler(e=>{if(!done){done=true;clearTimeout(timer);reject(new Error(e.message||'Не удалось подключиться к серверу.'))}})[method](payload);});}
const previousDay=d=>day(new Date(new Date(d+'T12:00:00+06:00').getTime()-86400000));
function demoGet(id){const db=read('database',{goals:{},reports:{}});return {goal:db.goals[id]||'',report:db.reports[id+':'+today()]||null,yesterdayPlan:db.reports[id+':'+previousDay(today())]?.tomorrow||'',date:today()};}
async function getParticipant(id){return LIVE?await rpc('getParticipant',{participantId:id}):demoGet(id)}
const personName=()=>state.participants.find(p=>p.id===state.id)?.name||'';
function setDate(){const el=document.getElementById('date');el.textContent=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',timeZone:'Asia/Omsk'}).format(new Date(state.date+'T12:00:00+06:00'));el.title=pretty(state.date)+' · Омское время'}
function showError(message){state.error=message;const el=document.getElementById('error');if(el){el.hidden=false;el.textContent=message;el.scrollIntoView?.({block:'nearest',behavior:'smooth'})}}
function goStep(step){state.step=step;state.error='';state.retrySend=false;saveDraft();render()}
function chooseAnother(){saveDraft();state.success=false;state.view='form';state.step=0;state.error='';state.returnReview=false;state.returnToDaily=false;render()}
function editQuestion(step,review=false){state.returnReview=review;state.returnToDaily=step===1?state.step:false;state.goalEditing=step===1;goStep(step)}
function answersHTML(report,editable=false){return `<dl class="summary">${questions.slice(1).map((q,i)=>`<dt>${q.label}${editable?`<button type="button" class="link" data-edit="${i+1}" aria-label="Изменить: ${q.label}">Изменить</button>`:''}</dt><dd data-summary="${q.key}">${escapeHTML(report[q.key]||'Пока не заполнено')}</dd>`).join('')}</dl>`}
function actionsHTML(){return `<div class="actions form-actions"><p id="draftStatus" class="draft-status" role="status" aria-live="polite"></p><div class="action-buttons">${state.step>0&&state.step!==2?'<button type="button" class="secondary" id="back">Назад</button>':''}<button class="primary" type="submit">${state.busy?(state.step===0?'Загружаем…':state.step===4?'Отправляем…':'Сохраняем…'):state.retrySend?'Повторить отправку':state.returnReview?'К проверке':state.step===4?(state.report?'Обновить отчёт':'Отправить'):'Далее'}</button></div></div>`}
function activeTab(){return state.view==='dashboard'?'dashboard':state.view==='history'?(state.historyTeam?'team':'mine'):'fill'}
function renderTabs(){
 const active=activeTab(),tabs=document.getElementById('tabs');
 tabs.innerHTML=[['dashboard','Сегодня','Сегодня'],['fill','Заполнить','Заполнить отчёт'],['mine','Мои отчёты','Мои отчёты'],['team','Участники','Отчёты участников']].map(([id,label,fullLabel])=>`<button type="button" role="tab" aria-label="${fullLabel}" title="${fullLabel}" id="tab-${id}" data-tab="${id}" aria-controls="main" aria-selected="${active===id}" tabindex="${active===id?0:-1}" ${state.busy?'disabled':''}>${label}</button>`).join('');
 document.getElementById('main').setAttribute('aria-labelledby','tab-'+active);
 tabs.querySelectorAll('[data-tab]').forEach(b=>{b.onclick=()=>switchTab(b.dataset.tab);b.onkeydown=e=>{const buttons=[...tabs.querySelectorAll('[data-tab]')],i=buttons.indexOf(b);let n;if(e.key==='ArrowRight')n=(i+1)%buttons.length;else if(e.key==='ArrowLeft')n=(i+buttons.length-1)%buttons.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=buttons.length-1;else return;e.preventDefault();buttons[n].focus()}});
}
async function switchTab(tab){
 if(state.busy||activeTab()===tab)return;
 if(tab==='fill'){state.view=['history','dashboard'].includes(state.historyReturn)?'form':state.historyReturn;render(false)}else if(tab==='dashboard')await beginDashboard();else await beginHistory(tab==='team');
 document.getElementById('tab-'+tab)?.focus({preventScroll:true});
}
function render(focus=true){

 main.querySelector('#dashboardFill').onclick=()=>switchTab('fill');main.querySelector('#calendarMonth').onchange=e=>{if(/^\d{4}-(0[1-9]|1[0-2])$/.test(e.target.value)&&e.target.value<=d.date.slice(0,7)){state.dashboardMonth=e.target.value;loadDashboard()}};main.querySelectorAll('[data-calendar]').forEach(b=>b.onclick=()=>openDatedReport(state.id,b.dataset.calendar));main.querySelectorAll('[data-today-person]').forEach(b=>b.onclick=()=>openDatedReport(b.dataset.todayPerson,d.date));main.querySelector('#refreshDashboard').onclick=loadDashboard;updateFooter();

async function rollDay(force=false,serverDay=null){if(!force&&state.date===today())return false;saveDraft();state.date=serverDay||today();state.report=null;state.revision=null;state.yesterdayPlan='';state.today=state.tomorrow=state.insight='';state.success=false;state.hasDraft=false;state.draftSaved=false;state.view='form';state.step=0;state.returnReview=false;state.returnToDaily=false;pending=null;state.error='По омскому времени начался новый день. Выберите участника, чтобы начать новый отчёт.';render();return true}
async function init(){document.getElementById('demo').hidden=LIVE;try{if(LIVE){const start=Date.now();const r=await rpc('getBootstrap',{});serverOffset=Date.parse(r.serverTime)-(start+Date.now())/2;state.participants=r.participants;state.date=r.date;}if(!state.participants.some(p=>p.id===state.id))state.id='';if(state.id){await loadPerson();enterPerson()}render(false)}catch(e){document.getElementById('main').innerHTML='<h1>Не удалось открыть форму</h1><p class="error" id="error" role="alert">Проверьте интернет и попробуйте ещё раз. Сохранённый черновик останется на устройстве.</p><button class="primary" id="retry">Попробовать снова</button>';document.getElementById('retry').onclick=init}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!state.busy)rollDay()});
if(typeof window!=='undefined'){window.addEventListener('online',updateFooter);window.addEventListener('offline',updateFooter);window.addEventListener('pagehide',saveDraft);}
