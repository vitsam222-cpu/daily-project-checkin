<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa"><title>Мой день — отчёт по проекту</title>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--ink:#172b4d;--muted:#59687f;--blue:#2459d3;--line:#dbe1eb;--soft:#edf3ff;--error:#a42c38;font-family:Arial,Helvetica,sans-serif;font-size:16px;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:wait;opacity:.65}button:focus-visible,textarea:focus-visible{outline:3px solid #86aaff;outline-offset:4px}::selection{background:#cdddff;color:#172b4d}a{color:var(--blue);text-underline-offset:4px}[hidden]{display:none!important}.shell{max-width:1060px;margin:auto;padding:36px 36px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:28px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700}.brand svg{width:30px;height:30px;color:var(--blue)}.date{color:var(--muted);font-size:14px;line-height:1.5;text-align:right;font-variant-numeric:tabular-nums}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:50px;padding-top:48px}.rail p{margin:0 0 25px;color:var(--muted);font-size:14px}.steps{list-style:none;margin:0;padding:0;display:grid;gap:24px}.steps li{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px}.number{display:grid;place-items:center;width:30px;height:30px;border:1px solid #b9c4d6;border-radius:50%;font-size:13px;flex-shrink:0}.steps .active{color:var(--blue);font-weight:700}.active .number{background:var(--blue);color:white;border-color:var(--blue)}.complete .number{background:#e0e9fc;color:#2459d3;border-color:#e0e9fc}.card{background:#fff;border-radius:16px;padding:40px;min-height:480px;box-shadow:0 12px 40px #172b4d08}.meta{display:flex;gap:12px;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:30px}.link{border:0;padding:8px 0;background:none;color:var(--blue);font-size:14px;text-decoration:underline;text-underline-offset:4px}.stepcount{color:var(--muted);font-size:14px;margin:0 0 12px}h1{font-size:32px;line-height:1.18;letter-spacing:-.025em;margin:0 0 14px;font-weight:700}h1:focus{outline:none}.description{color:var(--muted);line-height:1.6;margin:0 0 28px;max-width:46ch}.choices{display:grid;gap:10px}.choice{width:100%;display:flex;align-items:center;gap:14px;padding:18px 20px;min-height:64px;background:white;border:1px solid var(--line);border-radius:10px;text-align:left;color:var(--ink)}.choice:hover{background:#f7f9fd;border-color:#98b4f0}.choice[aria-checked=true]{border:2px solid var(--blue);padding:17px 19px;background:var(--soft)}.radio{width:20px;height:20px;border:1px solid #9caac0;border-radius:50%;display:grid;place-items:center}.choice[aria-checked=true] .radio{border:6px solid var(--blue);background:white}.fieldlabel{display:block;font-size:14px;font-weight:700;margin-bottom:10px}textarea{display:block;width:100%;resize:vertical;min-height:186px;padding:18px;border:1px solid #aab8cd;border-radius:10px;line-height:1.6;color:var(--ink);background:#fff;caret-color:var(--blue)}textarea::placeholder{color:#64748b}textarea[readonly]{background:#f7f9fd;border-color:var(--line)}textarea[aria-invalid=true]{border-color:var(--error)}.fieldfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;color:var(--muted);font-size:13px;min-height:28px}.count{font-variant-numeric:tabular-nums}.error{color:var(--error);line-height:1.5;font-size:14px;margin:16px 0 0}.notice{background:var(--soft);padding:14px 16px;border-radius:10px;line-height:1.5;font-size:14px;margin:0 0 24px}.actions{display:flex;gap:16px;justify-content:space-between;margin-top:30px}.primary,.secondary{border:0;border-radius:10px;padding:15px 24px;min-height:50px;font-weight:700}.primary{background:var(--blue);color:#fff;margin-left:auto;min-width:148px}.primary:hover{background:#1947b3}.secondary{color:var(--ink);background:#eef1f6}.secondary:hover{background:#e1e7f0}.footer{padding:24px 0;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}.demo{color:#745213;background:#fff4d8;border-radius:8px;padding:10px 16px;text-align:center;font-size:13px;margin-top:20px}.saved-icon{color:var(--blue);width:54px;height:54px;margin-bottom:24px}.summary{margin:24px 0 0;padding:0}.summary dt{font-size:13px;color:var(--muted);margin-top:18px}.summary dd{margin:6px 0 0;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.success .actions{flex-wrap:wrap}.success .primary{margin-left:0}.loading{color:var(--muted);padding:30px 0}.pulse{animation:appear .22s ease-out}@keyframes appear{from{opacity:.75;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}@media(max-width:720px){.shell{padding:20px 20px 0}.top{padding-bottom:20px}.brand{font-size:18px}.date{font-size:13px}.layout{display:block;padding-top:24px}.rail p{display:none}.steps{display:flex;gap:8px;margin-bottom:26px}.steps li{flex:1;display:block;height:4px;border-radius:4px;background:#d9e1ee}.steps li.active,.steps li.complete{background:var(--blue)}.steps .number,.steps .stepname{display:none}.card{padding:26px 22px;min-height:0}.meta{margin-bottom:24px}h1{font-size:28px}.description{margin-bottom:24px}textarea{min-height:210px}.actions{margin-top:26px;gap:12px}.primary,.secondary{padding:15px 20px}.footer{padding-bottom:calc(24px + env(safe-area-inset-bottom))}.demo{font-size:13px}}@media(max-width:370px){.shell{padding:16px 12px 0}.card{padding:24px 18px}.date{max-width:100px}.primary{min-width:0}}
.goal-context{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}.goal-context>span{font-size:12px;color:var(--muted)}.goal-context p{margin:8px 0 0;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:100px;overflow:auto}.plan-text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px;max-height:180px;overflow:auto}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="5" y="4" width="22" height="25" rx="5" stroke="currentColor" stroke-width="2"/><path d="M11 4V1M21 4V1M11 13h10M11 19h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Мой день</div><div class="date"><span id="date"></span><br>Омское время</div></header>
<div id="demo" class="demo" hidden>Тестовый режим · ответы сохраняются только в этом браузере</div>
<div class="layout"><aside class="rail" aria-label="Этапы заполнения"><p>Ежедневный отчёт</p><ol class="steps" id="steps"></ol></aside><main id="main" class="card" aria-busy="true"><p class="loading" role="status">Загружаем форму…</p></main></div>
<footer class="footer" id="footer">Один день. Несколько слов о главном.</footer>
</div>
<script>
'use strict';
const PARTICIPANTS = [
  { id: 'u1', name: 'Димурина Анжелика' },
  { id: 'u2', name: 'Криворучко Елена' },
  { id: 'u8', name: 'Лебедев Евгений' },
  { id: 'u3', name: 'Лукьянцева Ольга' },
  { id: 'u4', name: 'Росоловская Любовь' },
  { id: 'u5', name: 'Самойлов Виталий' },
  { id: 'u6', name: 'Сумарокова Юлия' },
  { id: 'u7', name: 'Усов Денис' }
];
const LIVE = typeof google !== 'undefined' && !!google.script?.run;
const PREFIX = LIVE ? 'daily-project-live-v2:' : 'daily-project-demo-v2:';
// Discard drafts from the trial run after the owner's data reset.
try{for(const key of Object.keys(localStorage)){if(key.startsWith('daily-project-live-v1:')||key.startsWith('daily-project-demo-v1:'))localStorage.removeItem(key)}}catch{}
const names=['Участник','Цель на проект','Сегодня','Завтра','Инсайт'];
const questions=[null,{key:'goal',title:'Какая у вас цель на проект?',description:'К чему хотите прийти? Цель сохранится — завтра её не придётся писать заново.',label:'Моя цель',placeholder:'Опишите результат, к которому стремитесь…'},{key:'today',title:'Что сделали сегодня?',description:'Запишите выполненные задачи. Даже небольшой шаг имеет значение.',label:'Сегодня я…',placeholder:'Что удалось сделать за сегодняшний день?'},{key:'tomorrow',title:'Что планируете на завтра?',description:'Назовите следующие шаги, которые помогут продвинуться к цели.',label:'Завтра я планирую…',placeholder:'С чего начнёте и что хотите успеть?'},{key:'insight',title:'Какой у вас инсайт дня?',description:'Что сегодня впечатлило, порадовало или стало открытием?',label:'Мой инсайт',placeholder:'Мысль, хороший момент или маленькое открытие…'}];
let storageOK=true;
const read=(key,fallback=null)=>{try{const v=localStorage.getItem(PREFIX+key);return v===null?fallback:JSON.parse(v)}catch{return fallback}};
const write=(key,value)=>{try{localStorage.setItem(PREFIX+key,JSON.stringify(value));return true}catch{storageOK=false;return false}};
const remove=key=>{try{localStorage.removeItem(PREFIX+key)}catch{}};
const day=(date=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Omsk',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
const pretty=d=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Omsk'}).format(new Date(d+'T12:00:00+06:00'));
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={step:0,id:read('selected',''),date:day(),participants:PARTICIPANTS,goal:'',today:'',tomorrow:'',insight:'',goalSaved:'',goalEditing:false,yesterdayPlan:'',returnToDaily:false,revisited:false,report:null,revision:null,busy:false,success:false};
let serverOffset=0, pending=null;
const today=()=>day(new Date(Date.now()+serverOffset));
const draftKey=()=>`draft:${state.id}:${state.date}`;
const saveDraft=()=>{if(!state.id||state.success)return;write(draftKey(),{goal:state.goal,today:state.today,tomorrow:state.tomorrow,insight:state.insight,goalBase:state.goalSaved});};
function rpc(method,payload){return new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{done=true;reject(new Error('Не получили подтверждение. Ответы сохранены в черновике. Повторите попытку.'))},30000);google.script.run.withSuccessHandler(r=>{if(!done){clearTimeout(timer);resolve(r)}}).withFailureHandler(e=>{if(!done){clearTimeout(timer);reject(new Error(e.message||'Не удалось подключиться. Попробуйте ещё раз.'))}})[method](payload);});}
const previousDay=d=>day(new Date(new Date(d+'T12:00:00+06:00').getTime()-86400000));
function demoGet(id){const db=read('database',{goals:{},reports:{}});return {goal:db.goals[id]||'',report:db.reports[id+':'+today()]||null,yesterdayPlan:db.reports[id+':'+previousDay(today())]?.tomorrow||'',date:today()};}
async function getParticipant(id){return LIVE?await rpc('getParticipant',{participantId:id}):demoGet(id)}
function setDate(){document.getElementById('date').textContent=pretty(state.date)}
function showError(message){const el=document.getElementById('error');if(el){el.hidden=false;el.textContent=message;}else{const p=document.createElement('p');p.className='error';p.setAttribute('role','alert');p.textContent=message;document.getElementById('main').append(p)}}
function render(focus=true){
 setDate();const main=document.getElementById('main');main.setAttribute('aria-busy',String(state.busy));
 const daily=state.step>=2||state.success;
 document.getElementById('steps').innerHTML=names.map((n,i)=>daily&&i<2?'':`<li class="${state.success||i<state.step?'complete':i===state.step?'active':''}" ${!state.success&&i===state.step?'aria-current="step"':''}><span class="number">${daily?i-1:i+1}</span><span class="stepname">${n}</span></li>`).join('');
 if(state.success){renderSuccess();return}
 const person=state.participants.find(p=>p.id===state.id);
 let body=state.step===0?`<h1 tabindex="-1">Кто заполняет отчёт?</h1><p class="description">Выберите себя. В следующий раз мы подставим ваш выбор автоматически.</p><div class="choices" role="radiogroup" aria-label="Участник">${state.participants.map(p=>`<button type="button" role="radio" aria-checked="${p.id===state.id}" class="choice" data-person="${p.id}"><span class="radio" aria-hidden="true"></span>${escapeHTML(p.name)}</button>`).join('')}</div>`:'';
 if(state.step>0){const q=questions[state.step],saved=state.step===1&&state.goalSaved&&!state.goalEditing;body=`<h1 tabindex="-1">${q.title}</h1><p class="description">${saved?'Ваша цель уже сохранена. Можно двигаться дальше или уточнить её.':q.description}</p>${state.step===1&&state.report?'<p class="notice">Сегодняшний отчёт уже есть. Изменения обновят эту строку в таблице.</p>':''}${state.step===2&&state.yesterdayPlan?`<div class="notice"><strong>Вчера вы планировали на сегодня</strong><div class="plan-text">${escapeHTML(state.yesterdayPlan)}</div></div>`:''}<label class="fieldlabel" for="answer">${q.label}</label><textarea id="answer" maxlength="5000" required aria-describedby="fieldhint error" ${saved?'readonly':''} placeholder="${q.placeholder}">${escapeHTML(state[q.key])}</textarea><div class="fieldfoot"><span id="fieldhint">${saved?'Сохранённая цель':'Обязательное поле'}</span><span class="count" id="counter">${state[q.key].length} / 5000</span>${saved?'<button type="button" class="link" id="editGoal">Изменить</button>':''}</div>`}
 main.innerHTML=`<div class="pulse"><div class="meta"><span>${state.step===0?'Ежедневный отчёт':escapeHTML(person?.name||'')}</span>${state.step>0?'<button class="link" id="change" type="button">Сменить участника</button>':''}</div>${daily?`<div class="goal-context"><span>Цель на проект</span><p>${escapeHTML(state.goalSaved)}</p><button class="link" id="changeGoal" type="button">Изменить цель</button></div>`:''}<p class="stepcount">${daily?`Шаг ${state.step-1} из 3`:`Настройка · ${state.step+1} из 2`}</p><form id="form" novalidate>${body}<p class="error" id="error" role="alert" hidden></p><div class="actions">${state.step>0&&state.step!==2?'<button type="button" class="secondary" id="back">Назад</button>':''}<button class="primary" type="submit" ${state.busy?'disabled':''}>${state.busy?'Сохраняем…':state.step===4?(state.report?'Обновить отчёт':'Отправить'):'Далее'}</button></div></form></div>`;
 main.querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click',()=>{state.id=b.dataset.person;write('selected',state.id);render(false)}));
 main.querySelector('#changeGoal')?.addEventListener('click',()=>{saveDraft();state.returnToDaily=state.step;state.step=1;state.goalEditing=true;render()});
 main.querySelector('#change')?.addEventListener('click',()=>{saveDraft();state.step=0;render()});
 main.querySelector('#back')?.addEventListener('click',()=>{saveDraft();if(state.step===1&&state.returnToDaily){state.goal=state.goalSaved;state.goalEditing=false;state.step=state.returnToDaily;state.returnToDaily=false;saveDraft()}else state.step--;render()});
 main.querySelector('#editGoal')?.addEventListener('click',()=>{state.goalEditing=true;render(false);main.querySelector('textarea').focus()});
 main.querySelector('textarea')?.addEventListener('input',e=>{state[questions[state.step].key]=e.target.value;pending=null;saveDraft();main.querySelector('#counter').textContent=e.target.value.length+' / 5000';e.target.removeAttribute('aria-invalid');main.querySelector('#error').hidden=true;updateFooter()});
 main.querySelector('#form').addEventListener('submit',next);
 if(state.busy)main.querySelectorAll('button,textarea').forEach(e=>e.disabled=true);
 if(focus)main.querySelector('h1')?.focus({preventScroll:true});updateFooter();
}
function updateFooter(){document.getElementById('footer').textContent=storageOK?(state.step>0&&!state.success?'Черновик сохраняется на этом устройстве':'Один день. Несколько слов о главном.'):'Браузер не разрешает сохранять черновик. Не закрывайте страницу до отправки.'}
async function loadPerson(){
 const r=await getParticipant(state.id);state.date=r.date;state.yesterdayPlan=r.yesterdayPlan||'';state.returnToDaily=false;state.success=false;state.revisited=false;state.goalSaved=r.goal;state.goal=r.goal;state.report=r.report;state.revision=r.report?.revision||null;state.goalEditing=false;
 const d=read(draftKey());for(const k of ['today','tomorrow','insight'])state[k]=d?.[k]??r.report?.[k]??'';
 if(d&&d.goalBase===r.goal&&typeof d.goal==='string'){state.goal=d.goal;state.goalEditing=d.goal!==r.goal}
 pending=null;
}
function enterPerson(){state.success=!!state.report;state.revisited=!!state.report;state.step=state.goalSaved&&!state.goalEditing?2:1;}
async function next(e){
 e.preventDefault();if(state.busy)return;
 if(state.step===0){if(!state.participants.some(p=>p.id===state.id)){showError('Выберите участника, чтобы продолжить.');return}state.busy=true;render(false);try{await loadPerson();write('selected',state.id);enterPerson();}catch(e){state.busy=false;render(false);showError(e.message);return}state.busy=false;render();return;}
 const q=questions[state.step];if(!state[q.key].trim()){const a=document.getElementById('answer');a.setAttribute('aria-invalid','true');showError('Напишите ответ, чтобы продолжить.');a.focus();return}
 if(await rollDay())return;
 if(state.step===1){state.busy=true;render(false);try{if(state.goal.trim()!==state.goalSaved){const result=LIVE?await rpc('saveGoal',{participantId:state.id,goal:state.goal.trim(),expectedGoal:state.goalSaved}):demoGoal();if(result.conflict)throw new Error('Цель была изменена на другом устройстве. Вернитесь к выбору участника, чтобы загрузить её.');state.goalSaved=state.goal.trim();state.goal=state.goalSaved;}saveDraft();}catch(e){state.busy=false;render(false);showError(e.message);return}state.busy=false;}
 if(state.step<4){saveDraft();state.step=state.returnToDaily||state.step+1;state.returnToDaily=false;render();return}await submit();
}
function demoGoal(){const db=read('database',{goals:{},reports:{}});if((db.goals[state.id]||'')!==state.goalSaved)return {conflict:true};db.goals[state.id]=state.goal.trim();if(!write('database',db))throw new Error('Браузер не разрешает запись. Разрешите хранение данных и повторите.');return {ok:true}}
async function submit(){
 for(let i=1;i<=4;i++){if(!state[questions[i].key].trim()){state.step=i;render();showError('Заполните это поле перед отправкой.');return}}
 state.busy=true;saveDraft();render(false);
 pending=pending||{participantId:state.id,date:state.date,goal:state.goal.trim(),today:state.today.trim(),tomorrow:state.tomorrow.trim(),insight:state.insight.trim(),expectedRevision:state.revision,requestId:crypto.randomUUID()};
 try{const result=LIVE?await rpc('submitReport',pending):demoSubmit(pending);if(result.code==='DATE_CHANGED'){state.busy=false;await rollDay(true,result.date);return}if(result.code==='CONFLICT'){pending=null;throw new Error('Этот отчёт уже изменён на другом устройстве. Ваш черновик сохранён. Вернитесь к выбору участника, чтобы загрузить текущую версию.')}if(result.code==='GOAL_CHANGED'){pending=null;throw new Error('Цель изменилась. Вернитесь к выбору участника, чтобы загрузить её.')}state.report=result.report;state.revision=result.report.revision;state.success=true;state.revisited=false;remove(draftKey());pending=null;state.busy=false;render();}catch(e){state.busy=false;render(false);showError(e.message)}
}
function demoSubmit(p){if(p.date!==today())return {code:'DATE_CHANGED',date:today()};const db=read('database',{goals:{},reports:{}}),key=p.participantId+':'+p.date,old=db.reports[key];if(old?.requestId===p.requestId)return {report:old};if((old?.revision||null)!==p.expectedRevision)return {code:'CONFLICT'};if(db.goals[p.participantId]!==p.goal)return {code:'GOAL_CHANGED'};const report={...p,revision:crypto.randomUUID(),submittedAt:new Date().toISOString()};db.reports[key]=report;if(!write('database',db))throw new Error('Не удалось сохранить ответы в браузере.');return {report};}
function renderSuccess(){const main=document.getElementById('main'),p=state.participants.find(p=>p.id===state.id);main.innerHTML=`<div class="success pulse"><svg class="saved-icon" viewBox="0 0 56 56" fill="none" aria-hidden="true"><circle cx="28" cy="28" r="25" stroke="currentColor" stroke-width="2"/><path d="m17 28 8 8 15-16" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><h1 tabindex="-1">${state.revisited?'Сегодняшний отчёт уже отправлен':'Ваш день сохранён'}</h1><p class="description">${escapeHTML(p.name)} · ${pretty(state.date)}<br>Отправлено в ${new Intl.DateTimeFormat('ru-RU',{timeZone:'Asia/Omsk',hour:'2-digit',minute:'2-digit'}).format(new Date(state.report.submittedAt))} по Омску<br>${LIVE?'Ответы записаны в Google Таблицу.':'Тестовые ответы сохранены в этом браузере.'}</p><dl class="summary">${questions.slice(1).map(q=>`<dt>${q.label}</dt><dd>${escapeHTML(state.report[q.key])}</dd>`).join('')}</dl><div class="actions"><button class="secondary" id="editReport">Изменить сегодняшний отчёт</button><button class="link" id="another">Другой участник</button></div></div>`;main.querySelector('#editReport').onclick=async()=>{if(await rollDay())return;state.success=false;state.step=state.goalEditing?1:2;render()};main.querySelector('#another').onclick=()=>{state.success=false;state.step=0;render()};main.querySelector('h1').focus({preventScroll:true});updateFooter()}
async function rollDay(force=false,serverDay=null){if(!force&&state.date===today())return false;saveDraft();state.date=serverDay||today();state.report=null;state.revision=null;state.yesterdayPlan='';state.today=state.tomorrow=state.insight='';state.success=false;state.step=0;pending=null;render();showError('По омскому времени начался новый день. Ежедневные поля очищены; прошлый черновик сохранён на устройстве.');return true}
async function init(){document.getElementById('demo').hidden=LIVE;try{if(LIVE){const start=Date.now();const r=await rpc('getBootstrap',{});serverOffset=Date.parse(r.serverTime)-(start+Date.now())/2;state.participants=r.participants;state.date=r.date;}if(!state.participants.some(p=>p.id===state.id))state.id='';if(state.id){await loadPerson();enterPerson()}render(false);}catch(e){document.getElementById('main').innerHTML='<h1>Не удалось открыть форму</h1><p class="error" id="error" role="alert"></p><button class="primary" id="retry">Попробовать снова</button>';showError(e.message);document.getElementById('retry').onclick=init;}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!state.busy)rollDay()});
init();
</script>
</body>
